[project]
name = "urganch-kartej-backend"
version = "0.1.0"
description = "FastAPI backend for Urganch Kartej"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.22,<1",
    "pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
    "shapely>=2.1,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]
